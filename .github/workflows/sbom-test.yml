name: SBOM Test
on:
  push:
    branches:
      - feat/sbom
jobs:
  generate-sboms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen

      - name: Create output directory
        run: mkdir -p output

      - name: Generate SBOM for scripts
        uses: CycloneDX/cdxgen-action@5668048b6479c5ee557eec3e1766132a4661681f # v1.0.0
        with:
          output: "./output/bom-card.xml"

      - name: Generate SBOM for website
        run: cdxgen -r ./cornucopia.owasp.org -o output/bom-website.json

      - name: Generate SBOM for engine
        run: cdxgen -r ./copi.owasp.org -o output/bom-engine.json

      
      - name: Upload SBOMs to Dependency-Track
        env:
          DT_URL: ${{ secrets.DEPENDENCYTRACK_URL }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
        run: |
          for bom in output/*.xml output/*.json; do
            echo "Uploading $bom..."
            response=$(curl -s -o /dev/null -w "%{http_code}" --location "$DT_URL/api/v1/bom" \
              --header "X-Api-Key: $DT_API_KEY" \
              --header "ngrok-skip-browser-warning: true" \
              --form "autoCreate=true" \
              --form "projectName=owasp-cornucopia" \
              --form "projectVersion=${{ github.ref_name }}" \
              --form "bom=@$bom") || true
            if [ "$response" == "200" ] || [ "$response" == "201" ]; then
              echo "Successfully uploaded $bom"
            else
              echo "Failed to upload $bom (HTTP $response)"
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: output/*