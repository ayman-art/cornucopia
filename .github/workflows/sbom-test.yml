name: SBOM Test
on:
  push:
    branches:
      - feat/sbom
jobs:
  generate-sboms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install
      - run: mkdir -p output

      - name: Generate SBOMs
        run: |
          npx @cyclonedx/cyclonedx-npm --output-format XML --output-file output/bom-card.xml ./scripts
          npx @cyclonedx/cyclonedx-npm --output-format XML --output-file output/bom-website.xml ./cornucopia.owasp.org
          npx @cyclonedx/cyclonedx-npm --output-format XML --output-file output/bom-engine.xml ./copi.owasp.org

      - uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: output/*.xml