name: SBOM Test
on:
  push:
    branches:
      - feat/sbom
jobs:
  generate-sboms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Create output directory
        run: mkdir -p output

      - name: Generate SBOM for scripts
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: './scripts'
          output: './output/bom-card.xml'

      - name: Generate SBOM for website
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: './cornucopia.owasp.org'
          output: './output/bom-website.xml'

      - name: Generate SBOM for engine
        uses: CycloneDX/gh-node-module-generatebom@v1
        with:
          path: './copi.owasp.org'
          output: './output/bom-engine.xml'

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: output/*.xml